name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      frontend: ${{ steps.paths.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Complete history supports merge-base diffs and multi-commit pushes.
          fetch-depth: 0
      - name: Test changed-file detection
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Select CI components
        id: paths
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/changes.py

  rust:
    needs: changes
    # Fail closed if detection fails or its output is missing; preserve check names.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust != 'false') }}
    name: Rust checks and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ferrix
          POSTGRES_PASSWORD: ferrix
          POSTGRES_DB: ferrix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrix -d ferrix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_TERM_COLOR: always
      FERRIX_TEST_DATABASE_URL: postgres://ferrix:ferrix@127.0.0.1:5432/ferrix_ci
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cmd-format: "rustup run stable {0}"
          cache-bin: "false"
          # Main warms a shared cache; PRs restore it without saving branch copies.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Rust tests including PostgreSQL integration
        run: cargo +stable test --locked --workspace -- --include-ignored
      - name: Agent client credential transport checks
        run: python3 -m unittest discover -s scripts/agents -p 'test_*.py' -v

  frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend != 'false') }}
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install npm
        run: npm install --global npm@12.2.2
      - name: Install dependencies
        run: npm ci
      - name: Security regression tests
        run: npm run test:security
      - name: Build frontend
        run: npm run build
