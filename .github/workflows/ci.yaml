name: CI

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Exact release source commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: true

jobs:
  helpers:
    name: CI helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Test CI helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v

  rust:
    needs: helpers
    name: Rust checks and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ferrix
          POSTGRES_PASSWORD: ferrix
          POSTGRES_DB: ferrix_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ferrix -d ferrix_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CARGO_TERM_COLOR: always
      FERRIX_TEST_DATABASE_URL: postgres://ferrix:ferrix@127.0.0.1:5432/ferrix_ci
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cmd-format: "rustup run stable {0}"
          cache-bin: "false"
          # Release and manual runs can save dependency caches.
          save-if: true
      - name: Check formatting
        run: cargo +stable fmt --all --check
      - name: Clippy
        run: cargo +stable clippy --locked --workspace --all-targets -- -D warnings
      - name: Archive safety and self-update recovery tests
        run: |
          python3 -m unittest discover -s scripts/tests -p test_application_archive.py -v
          python3 -m unittest discover -s scripts/tests -p test_self_update.py -v
      - name: Command updater smoke tests
        run: docker run --rm --entrypoint /bin/bash -e FERRIX_COMMAND_UPDATE_TEST=1 -v "$PWD:/src:ro" -v /var/run/docker.sock:/var/run/docker.sock:ro debian:bookworm-slim /src/scripts/tests/update-command.sh
      - name: Rust tests including PostgreSQL integration
        run: cargo +stable test --locked --workspace -- --include-ignored
      - name: Agent client credential transport checks
        run: python3 -m unittest discover -s scripts/agents -p 'test_*.py' -v

  frontend:
    needs: helpers
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install npm
        run: npm install --global npm@12.2.2
      - name: Install dependencies
        run: npm ci
      - name: Security regression tests
        run: npm run test:security
      - name: Build frontend
        run: npm run build
