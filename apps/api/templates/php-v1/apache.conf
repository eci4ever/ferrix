ServerTokens Prod
ServerSignature Off
<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    DirectoryIndex index.php
    <Directory /var/www/app>
        AllowOverride None
        Require all denied
    </Directory>
    <Directory /var/www/app/public>
        Options -Indexes -FollowSymLinks -Includes -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "(^\.|^(Dockerfile|composer\.(json|lock))$)">
            Require all denied
        </FilesMatch>
    </Directory>
    <DirectoryMatch "(^|/)\.(git|svn|hg)(/|$)">
        Require all denied
    </DirectoryMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 common
</VirtualHost>
