[package]
name = "ferrix-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sysinfo = { version = "0.37", default-features = false, features = ["system", "disk", "network"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
hex = "0.4"
hmac = "0.12"
flate2 = "1"
globset = "0.4"
futures-util = "0.3"
chacha20poly1305 = "0.10"
totp-rs = { version = "5.7", features = ["otpauth"] }
url = "2"
axum = { version = "0.8", features = ["ws"] }
bollard = { version = "0.20", features = ["buildkit_providerless", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls-native-roots"] }
croner = "5"
rust-s3 = { version = "0.38", default-features = false, features = ["tokio-rustls-tls-ring", "fail-on-err"] }
tempfile = "3"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tokio-util = { version = "0.7", features = ["io"] }
hickory-resolver = "0.25"
x509-parser = "0.18"
chrono-tz = "0.10"
iana-time-zone = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "io-util", "fs"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

