name: ${COMPOSE_PROJECT_NAME:?Run python3 scripts/setup-dev.py first}
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ferrix
      POSTGRES_PASSWORD: ferrix
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Missing POSTGRES_PORT}:5432"
    volumes:
      - ferrix_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrix -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 10
  proxy:
    image: caddy:2-alpine
    profiles: [websites]
    restart: unless-stopped
    environment:
      FERRIX_WEBSITE_UPSTREAM: host.docker.internal:${FERRIX_WEBSITE_PORT:-8090}
    ports:
      - "${FERRIX_WEBSITE_HOST_BIND:-127.0.0.1}:${FERRIX_WEBSITE_HTTP_PORT:-9080}:80"
      - "${FERRIX_WEBSITE_HOST_BIND:-127.0.0.1}:${FERRIX_WEBSITE_HTTPS_PORT:-9443}:443"
    volumes:
      - ./deploy/${FERRIX_LOCAL_CADDYFILE:-Caddyfile.local}:/etc/caddy/Caddyfile:ro
      - ferrix_caddy_data:/data
    networks: [default, ingress]
    read_only: true
    tmpfs: [/config, /tmp]
    security_opt: [no-new-privileges:true]
networks:
  ingress:
    name: ${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}_ingress
    labels:
      io.ferrix.ingress: ${COMPOSE_PROJECT_NAME:?Missing COMPOSE_PROJECT_NAME}_ingress

volumes:
  ferrix_postgres:
  ferrix_caddy_data:
